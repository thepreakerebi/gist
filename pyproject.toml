[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gist-compress"
version = "0.1.0"
description = "Audio-visual context compression layer for video LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
gist = "gist.cli:main"
gist-eval = "gist.eval.cli:main"
gist-failure-analysis = "gist.eval.failure_analysis:main"
gist-regression = "gist.eval.regression:main"
gist-smoke-test = "gist.eval.smoke:main"
gist-sota-benchmark = "gist.eval.sota:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]
vision = [
  "pillow>=10.0.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
]
sota = [
  "accelerate>=0.33.0",
  "huggingface-hub>=0.24.0",
  "pandas>=2.2.0",
  "pillow>=10.0.0",
  "pyarrow>=16.0.0",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "transformers>=4.50.0",
  "yt-dlp>=2025.1.0",
]
audio = [
  "faster-whisper>=1.1.0",
]
sound = [
  "numpy>=1.26.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
  "slow: tests that download or execute model dependencies",
]
