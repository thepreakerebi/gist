[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gist-compress"
version = "0.1.0"
description = "Audio-visual context compression layer for video LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
gist = "gist.cli:main"
gist-ablation = "gist.eval.ablation:main"
gist-benchmark-videomme = "gist.eval.benchmark_videomme:main"
gist-benchmark-videomme-vision = "gist.eval.benchmark_videomme_vision:main"
gist-downstream = "gist.eval.downstream:main"
gist-acceptance = "gist.eval.acceptance:main"
gist-eval = "gist.eval.cli:main"
gist-extraction-eval = "gist.eval.extraction:main"
gist-extraction-smoke = "gist.eval.extraction_smoke:main"
gist-failure-analysis = "gist.eval.failure_analysis:main"
gist-label = "gist.label:main"
gist-label-batch = "gist.label_batch:main"
gist-label-compression = "gist.label_compression:main"
gist-label-smoke = "gist.eval.label_smoke:main"
gist-long-video-smoke = "gist.eval.long_video_smoke:main"
gist-long-video-suite = "gist.eval.long_video_suite:main"
gist-quality-eval = "gist.eval.quality:main"
gist-regression = "gist.eval.regression:main"
gist-smoke-test = "gist.eval.smoke:main"
gist-sota-benchmark = "gist.eval.sota:main"
gist-structured-extract = "gist.gateway.structured:main"
gist-structured-schemas = "gist.gateway.structured:schemas_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]
vision = [
  "pillow>=10.0.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
]
sota = [
  "accelerate>=0.33.0",
  "huggingface-hub>=0.24.0",
  "pandas>=2.2.0",
  "pillow>=10.0.0",
  "pyarrow>=16.0.0",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "transformers>=4.50.0",
  "yt-dlp>=2025.1.0",
]
audio = [
  "faster-whisper>=1.1.0",
]
sound = [
  "numpy>=1.26.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gist = ["data/extraction/*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
  "slow: tests that download or execute model dependencies",
]
